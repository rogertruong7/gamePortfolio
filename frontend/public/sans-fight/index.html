<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sans fight</title>
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: #000;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      canvas {
        touch-action: none;
      }
    </style>
    <script>
      // The game was exported to report to an ad network, and it calls these from its event
      // sheets. They do nothing here except tell the site how the fight is going.
      (function () {
        // The GAME OVER screen stays until the player presses Escape, or X quits it, but no
        // longer than this
        const GAME_OVER_SECONDS = 30;

        const tell = (message) => parent.postMessage({ sansFight: message }, location.origin);
        let fighting = false;
        let gameOver = false;
        // It loads while the player is still diving, so it waits to be told to go
        let waiting = true;

        window.startFight = function () {
          waiting = false;
          cr_setSuspended(false);
        };

        document.addEventListener("visibilitychange", () => {
          cr_setSuspended(document.hidden || waiting);
        });

        // Runs as the battle starts
        function start() {
          fighting = true;
          if (waiting) cr_setSuspended(true);
          tell("started");
        }

        // Runs when the GAME OVER screen appears, and again as the battle ends
        function stop() {
          if (!fighting || gameOver) return;
          gameOver = true;
          // Its music keeps playing while the player reads the offer that opens in another tab
          window.keepPlayingInBackground = true;
          tell("gameover");
          // Losing means hiring him, so the offer's already written, and here's his resume. Opening
          // the tab uses up the key press, so the resume downloads rather than asking where to go.
          window.emailOffer();
          window.downloadResume();
          setTimeout(() => tell("died"), GAME_OVER_SECONDS * 1000);
        }

        // Runs as the battle ends, whichever way it went, and on the menu before it starts
        window.ShowAd = function () {
          if (!fighting) return;
          fighting = false;
          tell(gameOver ? "died" : "won");
        };

        window.ysdk = {
          features: {
            LoadingAPI: { ready() {} },
            GameplayAPI: { start, stop },
          },
        };

        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") tell(gameOver ? "died" : "fled");
          // During the battle, Return is the game's confirm key
          if (event.key === "Enter" && gameOver) tell("died");
        });
      })();
    </script>
  </head>
  <body>
    <div id="c2canvasdiv">
      <canvas id="c2canvas" width="640" height="480"></canvas>
    </div>
    <script src="jquery-3.4.1.min.js"></script>
    <script src="c2runtime.js"></script>
    <script>
      // The game draws its pixel art without smoothing, which suits everything but the photo of
      // Roger's face on Sans's head. That one texture is smoothed so the face stays sharp.
      (function () {
        const loadTexture = cr.GLWrap.prototype.loadTexture;
        cr.GLWrap.prototype.loadTexture = function (img, tiling, linearSampling, ...rest) {
          const smooth = linearSampling || /sanshead-sheet0\.png/.test(img.src || "");
          return loadTexture.call(this, img, tiling, smooth, ...rest);
        };

        // The ACT options are Roger's links and a way to email him, sparing him gets you his
        // resume, and dying has you email him a job offer.
        // The game runs these by name when they're picked, and the page does the rest. The site
        // passes the resume's address (Helpers/resume.js).
        const resume = new URLSearchParams(location.search).get("resume");
        const RESUME_NAME = "RogerTruongResume.pdf";
        const LINKS = {
          menuactresume: saveResume,
          menuspare: saveResume,
          menuactgithub: () => openTab("https://github.com/rogertruong7"),
          menuactlinkedin: () => openTab("https://www.linkedin.com/in/roger-truong/"),
          menuactcontact: () => emailOffer(),
        };

        function openTab(url) {
          window.open(url, "_blank", "noopener,noreferrer");
        }

        function download(url) {
          const link = document.createElement("a");
          link.href = url;
          link.download = RESUME_NAME;
          document.body.appendChild(link);
          link.click();
          link.remove();
        }

        // Asks where to save it where the browser can (Chrome and Edge), and otherwise downloads
        // it as usual. The picker has to open straight away, while the key press that got here
        // still counts, so the file is only fetched once a spot has been picked.
        async function saveResume() {
          if (!resume) return;
          if (window.showSaveFilePicker) {
            try {
              const handle = await window.showSaveFilePicker({
                suggestedName: RESUME_NAME,
                types: [{ description: "PDF", accept: { "application/pdf": [".pdf"] } }],
              });
              const file = await (await fetch(resume)).blob();
              const writable = await handle.createWritable();
              await writable.write(file);
              await writable.close();
              return;
            } catch (error) {
              // Closing the picker means they didn't want it
              if (error.name === "AbortError") return;
              console.warn("Couldn't ask where to save the resume, so downloading it instead", error);
            }
          }
          download(resume);
        }

        const OFFER = {
          to: "rogertruong7@gmail.com",
          subject: "I lost, so you're hired",
          body: "Hi Roger,\n\nI lost the boss fight, so as agreed, you're hired.\n\nWhen can you start?",
        };

        // Opens the job offer, already written, as a Gmail draft in a new tab. A mailto link only
        // opens a blank tab for anyone without an email app set up in their browser. The browser
        // allows the tab because a key was just pressed.
        function emailOffer() {
          const draft = new URLSearchParams({ view: "cm", fs: "1", to: OFFER.to, su: OFFER.subject, body: OFFER.body });
          openTab(`https://mail.google.com/mail/?${draft}`);
        }
        window.emailOffer = emailOffer;
        window.downloadResume = () => resume && download(resume);

        const acts = cr.plugins_.Function.prototype.acts;
        const callFunction = acts.CallFunction;
        acts.CallFunction = function (name, params) {
          LINKS[String(name).toLowerCase()]?.();
          return callFunction.call(this, name, params);
        };
      })();
    </script>
    <script>
      jQuery(document).ready(function () {
        cr_createRuntime("c2canvas");
        // Leaving the tab or the window suspends the game, which pauses its sound. Every way of
        // doing that goes through this, so the GAME OVER music can be kept going.
        const runtime = cr_getC2Runtime();
        const setSuspended = runtime.setSuspended;
        runtime.setSuspended = function (suspend) {
          if (suspend && window.keepPlayingInBackground) return;
          setSuspended.call(this, suspend);
        };
        // In decibels: this is 15% of the game's original volume
        cr.plugins_.Audio.prototype.acts.SetMasterVolume(-16.48);
        // The site's mute button is out of reach once the fight is up, so it carries over
        if (new URLSearchParams(location.search).has("muted")) {
          cr.plugins_.Audio.prototype.acts.SetSilent(0);
        }
      });
    </script>
  </body>
</html>
